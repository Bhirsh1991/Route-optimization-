name: Test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify shipped CSS and offline shell
        run: |
          npm run build
          git diff --exit-code -- assets/app.css service-worker.js
      - name: Check downloadable AI skills against the source
        run: python3 scripts/build-ai-skill.py --check
      - name: Check JS syntax
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f";
          done
      - name: Run unit tests
        run: npm test
      - name: Run test script
        run: bash test.sh
      - name: Mobile browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
