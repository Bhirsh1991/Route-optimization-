name: Test

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify shipped CSS, page security policies and offline shell
        run: |
          npm run build
          git diff --exit-code -- assets/app.css index.html ai/index.html service-worker.js
      - name: Check downloadable AI skills against the source
        run: python3 scripts/build-ai-skill.py --check
      - name: Check JS syntax
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f";
          done
      - name: Run unit tests
        run: npm test
      - name: Run test script
        run: bash test.sh
      - name: Mobile browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
